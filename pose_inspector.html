<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poses Locas AR — Visualizador Interno de Poses y Esquemas</title>
  <style>
    :root {
      --bg: #0d0c14;
      --card-bg: #181524;
      --card-border: #2a2540;
      --accent-cyan: #00e5ff;
      --accent-gold: #ffd700;
      --accent-magenta: #ff2a85;
      --accent-green: #00e676;
      --text: #f0f0f5;
      --text-muted: #9a9ab0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .badge {
      background: #221c33;
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--accent-cyan);
    }
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #251e38;
      color: #fff;
      border-color: var(--accent-cyan);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }
    .tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0, 229, 255, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    .preview-box {
      display: flex;
      gap: 12px;
      background: #0f0d17;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #201b30;
      min-height: 180px;
      align-items: center;
      justify-content: center;
    }
    canvas {
      background: #141120;
      border-radius: 6px;
      border: 1px solid #28223d;
    }
    .illus-img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #383050;
      background: #1a162b;
    }
    .illus-placeholder {
      width: 130px;
      height: 130px;
      border-radius: 6px;
      border: 1px dashed #383050;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      padding: 8px;
    }
    .meta-list {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meta-list strong {
      color: var(--text);
    }
    .action-badge {
      background: rgba(0, 230, 118, 0.1);
      border-left: 3px solid var(--accent-green);
      padding: 6px 10px;
      font-size: 12px;
      color: #d8ffd8;
      border-radius: 0 4px 4px 0;
    }
    .audit-verdict {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #ffd700;
      background: rgba(255, 215, 0, 0.08);
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>

      </p>
    </div>
    <div class="badge-bar">

    const grid = document.getElementById('poses-grid');

    function renderCards(poses) {
      grid.innerHTML = '';
      poses.forEach((pose, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${idx}`;

        const isDynamic = pose.category === 'dynamic';
        const tagLabel = isDynamic ? 'Dinámica (Ritmo)' : 'Estática (Hold)';

        const illusHtml = pose.icon
          ? `<img src="${pose.icon}" class="illus-img" alt="${pose.name}" onerror="this.outerHTML='<div class=\\'illus-placeholder\\'>Sin Ilustración JPG</div>'">`
          : `<div class="illus-placeholder">Modo Silueta<br>(Sin Ilustración)</div>`;

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${pose.name}</span>
            <span class="tag" style="color: ${pose.color}; border-color: ${pose.color};">${tagLabel}</span>
          </div>
          <div class="preview-box">
            ${illusHtml}
            <canvas id="canvas-${idx}" width="160" height="160"></canvas>
          </div>
          <div class="action-badge">
            <strong>Cómo hacerla:</strong> ${pose.action}
          </div>
          <div class="meta-list">
            <div><strong>Biomecánica:</strong> ${pose.biomechanics}</div>
            <div><strong>Perfiles:</strong> ${pose.tags.map(t => t.toUpperCase()).join(', ')}</div>
          </div>
          <div class="audit-verdict">
            <span>🛡️ Auditoría UI/UX:</span> <strong>${pose.audit}</strong>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function drawStickman(ctx, pts, color) {
      const w = 160, h = 160;
      ctx.clearRect(0, 0, w, h);

      // Floor line
      ctx.strokeStyle = '#5a5a73';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(w * 0.15, h * 0.92);
      ctx.lineTo(w * 0.85, h * 0.92);
      ctx.stroke();

      function p(pt) { return [pt[0] * w, pt[1] * h]; }

      // Torso fill
      ctx.fillStyle = '#2d2842';
      ctx.beginPath();
      const ls = p(pts.ls), rs = p(pts.rs), rh = p(pts.rh), lh = p(pts.lh);
      ctx.moveTo(ls[0], ls[1]);
      ctx.lineTo(rs[0], rs[1]);
      ctx.lineTo(rh[0], rh[1]);
      ctx.lineTo(lh[0], lh[1]);
      ctx.closePath();
      ctx.fill();

      // Bones
      const bones = [
        ['ls', 'rs'], ['ls', 'lh'], ['rs', 'rh'], ['lh', 'rh'],
        ['lh', 'lk'], ['lk', 'la'], ['rh', 'rk'], ['rk', 'ra']
      ];
      ctx.strokeStyle = '#d2d2dc';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      bones.forEach(([a, b]) => {
        if (pts[a] && pts[b]) {
          ctx.beginPath();
          const pa = p(pts[a]), pb = p(pts[b]);
          ctx.moveTo(pa[0], pa[1]);
          ctx.lineTo(pb[0], pb[1]);
          ctx.stroke();
        }
      });

      // Arms
      const armBones = [['ls', 'le'], ['le', 'lw'], ['rs', 're'], ['re', 'rw']];
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      armBones.forEach(([a, b]) => {
        if (pts[a] && pts[b]) {
          ctx.beginPath();
          const pa = p(pts[a]), pb = p(pts[b]);
          ctx.moveTo(pa[0], pa[1]);
          ctx.lineTo(pb[0], pb[1]);
          ctx.stroke();
        }
      });

      // Joints
      ctx.fillStyle = '#ffffff';
      ['lw', 'rw'].forEach(k => {
        if (pts[k]) {
          const pt = p(pts[k]);
          ctx.beginPath();
          ctx.arc(pt[0], pt[1], 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Head
      if (pts.nose) {
        const pt = p(pts.nose);
        ctx.fillStyle = '#f0f0ff';
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    let activeFilter = 'all';

    function filterPoses(type, btn) {
      activeFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      let filtered = POSES_DATA;
      if (type === 'junior') filtered = POSES_DATA.filter(p => p.tags.includes('junior'));
      else if (type === 'cardio') filtered = POSES_DATA.filter(p => p.tags.includes('cardio'));
      else if (type === 'zen') filtered = POSES_DATA.filter(p => p.tags.includes('zen'));
      else if (type === 'dynamic') filtered = POSES_DATA.filter(p => p.category === 'dynamic');
      else if (type === 'static') filtered = POSES_DATA.filter(p => p.category === 'static');

      renderCards(filtered);
    }

    let startTime = performance.now();
    function animate() {
      const t = (performance.now() - startTime) / 1000;
      let filtered = POSES_DATA;
      if (activeFilter === 'junior') filtered = POSES_DATA.filter(p => p.tags.includes('junior'));
      else if (activeFilter === 'cardio') filtered = POSES_DATA.filter(p => p.tags.includes('cardio'));
      else if (activeFilter === 'zen') filtered = POSES_DATA.filter(p => p.tags.includes('zen'));
      else if (activeFilter === 'dynamic') filtered = POSES_DATA.filter(p => p.category === 'dynamic');
      else if (activeFilter === 'static') filtered = POSES_DATA.filter(p => p.category === 'static');

      filtered.forEach((pose, idx) => {
        const canvas = document.getElementById(`canvas-${idx}`);
        if (canvas) {
          const ctx = canvas.getContext('2d');
          const pts = pose.anim(t);
          drawStickman(ctx, pts, pose.color);
        }
      });
      requestAnimationFrame(animate);
    }

    renderCards(POSES_DATA);
    animate();
  </script>
